<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 副業 30 天儀表板</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f4f7f8;color:#172b3a;max-width:850px;margin:auto;padding:20px;line-height:1.6}header{background:#164a63;color:white;border-radius:14px;padding:22px}h1{margin:0}h2{color:#0f6b63;margin-bottom:8px}.box{background:white;border:1px solid #d6e1e5;border-radius:12px;padding:18px;margin-top:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;background:#e8f4f1;text-align:center;border-radius:8px}b.num{font-size:24px;color:#076860;display:block}button{background:#08766d;color:white;padding:9px 12px;border:0;border-radius:7px;font-size:15px;cursor:pointer}button.gray{background:#647984}input,textarea{font:inherit;padding:8px;border:1px solid #b8c9d0;border-radius:6px;width:100%;box-sizing:border-box}textarea{height:85px}.days{display:flex;flex-wrap:wrap;gap:7px}.day{background:white;color:#164a63;border:1px solid #b9cbd1;padding:8px 10px;border-radius:7px}button.day.active{background:#164a63;color:white}.task{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #e4ebee}.task input{width:20px;flex:none}.done{text-decoration:line-through;color:#71808a}small{color:#607481}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style><body><header><h1>AI 副業｜30 天執行儀表板</h1><p>每天 1–2 小時｜目標：額外收入 5,000–10,000 元</p></header><section class="box"><div class="stats"><div class="stat"><b class="num" id="p">0%</b>任務進度</div><div class="stat"><b class="num" id="r">$0</b>已收款</div><div class="stat"><b class="num" id="m">$6,000</b>收入目標</div></div><p>收入目標：<input id="goal" type="number" value="6000"> 已收款：<input id="income" type="number" value="0"></p><button onclick="saveMoney()">儲存收入</button></section><section class="box"><h2>選擇今天</h2><div class="days" id="days"></div></section><section class="box"><h2 id="title"></h2><label class="task"><input type="checkbox" id="check"><span id="task"></span></label><p><b>今日紀錄／卡關處</b></p><textarea id="note" placeholder="今天誰回覆？遇到什麼問題？"></textarea><p><button onclick="saveDay()">儲存今日進度</button></p><small>資料只存在此裝置目前的瀏覽器。若要換電腦或清除瀏覽器資料，請先手動備份你的筆記。</small></section><section class="box"><h2>首次私訊範本（通用行業版）</h2><p id="msg">你好，我看到你最近分享的［具體作品／服務］很有特色。帳號裡已經有不少成果展示，但第一次看到的人可能不容易立刻知道「第一次適合選什麼」或「怎麼預約」。我正在為小商家整理可直接使用的預約導向內容包；我可以先傳 2 個適合你的貼文選題參考，你想看嗎？</p><button class="gray" onclick="navigator.clipboard.writeText(document.getElementById('msg').innerText);alert('已複製')">複製訊息</button></section><script>const tasks=["選定第一個目標行業（例如：美業、健身、攝影、房仲、餐飲等）並確認 599、1,800、2,800 元三層方案","建立客戶需求 Google 表單（服務、價格、客群、預約方式、語氣、禁語）","完成一份標示為示範的 7 天內容包（可選任一行業）","建立 Google Drive 交付資料夾與文件模板","寫好一頁式服務介紹與修改規則","找 15 個近期活躍的目標行業帳號並記錄觀察","發送 5 則個人化首次私訊，更新名單","找 5 位、發 5 則首次私訊、跟進舊訊息","找 5 位、發 5 則首次私訊、回覆詢問","找 5 位、發 5 則首次私訊、記下常見問題","整理對話，完成 FAQ 與 599 元體驗包說明","找 5 位、發 5 則私訊；有興趣者只給小範例","找 5 位、發 5 則私訊；對未回覆者只跟進一次","週復盤：統計私訊、回覆、對話與報價","對有興趣者發送完整報價與付款／交付規則","維持 3–5 則開發；成交後才發完整表單","處理第 1 位客戶：依問卷做內容初稿","完成貼文、短影音腳本、私訊回覆與品質檢查","交付內容，索取回饋與匿名案例授權","保存提示詞、問卷與交付格式，完成模板化","檢查瓶頸：名單、開場、方案或跟進，只調整一項","找 5 位、發 5 則私訊，必要時提及案例","找 5 位、發 5 則私訊，處理對話與報價","找 5 位、發 5 則私訊，完成已成交案件","找 5 位、發 5 則私訊，累計完成 50 位精準名單","處理交付與追單；不重複騷擾未回覆者","列出「30 天貼文＋私訊模板」數位商品大綱","製作模板包的 5 則樣本內容","盤點收入、私訊、對話、報價、成交與總工時","決定下月定價、開發目標與固定執行時段"];let s=JSON.parse(localStorage.getItem('sidejob30')||'{}');let d=s.day||1;function render(){let a=document.getElementById('days');a.innerHTML='';tasks.forEach((x,i)=>{let b=document.createElement('button');b.className='day '+(d==i+1?'active':'')+(s['c'+(i+1)]?' done':'');b.textContent='Day '+(i+1)+(s['c'+(i+1)]?' ✓':'');b.onclick=()=>{d=i+1;render()};a.appendChild(b)});document.getElementById('title').textContent='Day '+d;document.getElementById('task').textContent=tasks[d-1];document.getElementById('check').checked=!!s['c'+d];document.getElementById('note').value=s['n'+d]||'';let done=tasks.filter((_,i)=>s['c'+(i+1)]).length;document.getElementById('p').textContent=Math.round(done/30*100)+'%';document.getElementById('goal').value=s.goal||6000;document.getElementById('income').value=s.income||0;document.getElementById('r').textContent='$'+(s.income||0);document.getElementById('m').textContent='$'+(s.goal||6000)}function saveDay(){s.day=d;s['c'+d]=document.getElementById('check').checked;s['n'+d]=document.getElementById('note').value;localStorage.setItem('sidejob30',JSON.stringify(s));render()}function saveMoney(){s.goal=document.getElementById('goal').value;s.income=document.getElementById('income').value;localStorage.setItem('sidejob30',JSON.stringify(s));render()}render();</script></body></html>
